name: build
on:
  push:
    branches: [main]
permissions:
  contents: write   # semantic-release pushes the version tag and GitHub release
  packages: write
  issues: write     # semantic-release comments on released issues and PRs
  pull-requests: write
concurrency:
  group: build-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # semantic-release and git describe need the full history and tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

      # Conventional commits since the last tag decide the next version (feat → minor,
      # fix/perf → patch, "!" or BREAKING CHANGE → major). No such commit → no release.
      - id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every image says which build it is: the new release, or the last release plus the
      # commits since it (v1.2.3-4-gabc1234), or the commit alone before the first release.
      - id: version
        run: |
          if [ "${{ steps.release.outputs.new_release_published }}" = "true" ]; then
            v="v${{ steps.release.outputs.new_release_version }}"
          else
            git fetch --tags --force
            v="$(git describe --tags --always)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building $v" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ahc:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ahc:latest
            ${{ steps.release.outputs.new_release_published == 'true' && format('ghcr.io/{0}/ahc:v{1}', github.repository_owner, steps.release.outputs.new_release_version) || '' }}
