name: build
on:
  push:
    branches: [main]
permissions:
  contents: write   # go-semantic-release creates the version tag and GitHub release
  packages: write
concurrency:
  group: build-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe needs the history and tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

      # Conventional commits since the last v* tag pick the next version (feat → minor,
      # fix → patch, "!" or BREAKING CHANGE → major). A dry run only computes it: the tag and
      # release are created after the image is pushed, so a release always has an image.
      # No releasable commits → the step succeeds with an empty version.
      - id: next
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry: true

      # Every image says which build it is: the new release, or the last release plus the
      # commits since it (v1.2.3-4-gabc1234), or the commit alone before the first release.
      - id: version
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          if [ -n "$NEXT" ]; then v="v$NEXT"; else v="$(git describe --tags --always)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building $v" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ahc:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ahc:latest
            ${{ steps.next.outputs.version != '' && format('ghcr.io/{0}/ahc:v{1}', github.repository_owner, steps.next.outputs.version) || '' }}

      # The image is out: now tag the commit and publish the release (GitHub API, no git push).
      - if: steps.next.outputs.version != ''
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
