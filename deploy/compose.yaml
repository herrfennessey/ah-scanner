# /opt/ahc/compose.yaml on the NUC
services:
  ahc:
    image: ghcr.io/herrfennessey/ahc:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env          # BLIZZARD_CLIENT_ID, BLIZZARD_CLIENT_SECRET, AHC_MCP_TOKEN (chmod 600); optional IMAGE_TAG
    volumes:
      - ./data:/data
      - ./config.yaml:/config.yaml:ro
    ports:
      - "4653:4653"         # web UI + /mcp on your local network: http://<nuc>:4653
